name: Release Primer

on:
  push:
    branches: [main]
    paths: [package.json]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Detect release version
        id: version
        env:
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./package.json").version')
          previous=$(git show "$BEFORE:package.json" | node -p 'JSON.parse(require("node:fs").readFileSync(0)).version')
          if [[ "$version" == "$previous" || "${version}.0" == "$previous" ]]; then
            exit 0
          fi
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Primer releases require a package.json version in X.Y form."
            exit 1
          fi

          tag="v${version}"
          if [[ "$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)" == false ]]; then
            echo "$tag is already published."
            exit 0
          fi
          if git show-ref --verify --quiet "refs/tags/$tag" &&
             [[ "$(git rev-parse "refs/tags/$tag^{commit}")" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag $tag already points to a different commit."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build theme archive
        if: steps.version.outputs.tag != ''
        run: |
          npm ci
          npm run build

      - name: Publish release
        if: steps.version.outputs.tag != ''
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          previous_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude "$TAG" "$GITHUB_SHA" 2>/dev/null || true)
          range="${previous_tag:+$previous_tag..}$GITHUB_SHA"
          notes="$RUNNER_TEMP/primer-release-notes.md"
          node --input-type=module - "$range" > "$notes" <<'NODE'
          import {execFileSync} from 'node:child_process'

          const headings = new Map([
            ['feat', '功能'], ['fix', '修复'], ['perf', '性能'], ['refactor', '重构'],
            ['docs', '文档'], ['test', '测试'], ['build', '构建'], ['ci', '持续集成'],
            ['style', '风格'], ['chore', '维护'],
          ])
          const groups = new Map([...headings.values(), '其他'].map(heading => [heading, []]))
          const commits = execFileSync('git', ['log', '--no-merges', '--format=%h %s', process.argv[2]], {encoding: 'utf8'})

          for (const line of commits.trimEnd().split('\n').filter(Boolean)) {
            const separator = line.indexOf(' ')
            const hash = line.slice(0, separator)
            const subject = line.slice(separator + 1)
            const type = subject.match(/^([a-z]+)(?:\([^)]*\))?!?: /)?.[1]
            groups.get(headings.get(type) ?? '其他').push(`- ${subject} (${hash})`)
          }
          const sections = [...groups].filter(([, entries]) => entries.length)
          console.log(sections.map(([heading, entries]) => `### ${heading}\n\n${entries.join('\n')}`).join('\n\n'))
          NODE

          gh release create "$TAG" "dist/Primer-$TAG.zip" \
            --target "$GITHUB_SHA" --title "Xboard Primer $TAG" --notes-file "$notes"
